name: Bug report
description: Something is broken or not doing what it should
labels: [bug]
body:
  - type: dropdown
    id: product
    attributes:
      label: Product
      options:
        - Skram
        - Skram Vault
        - Skram Tunnel
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `<command> version` (for example `skram version`)
      placeholder: skram version 0.13.0 (abc1234, 2026-09-21)
    validations:
      required: true
  - type: input
    id: os-arch
    attributes:
      label: OS and architecture
      placeholder: macOS 15.1, arm64
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: doctor output
      description: Output of `<command> doctor` (for example `skram doctor`)
      render: text
    validations:
      required: true
  - type: textarea
    id: happened
    attributes:
      label: What happened
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
