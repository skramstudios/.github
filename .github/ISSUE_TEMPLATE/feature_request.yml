name: Feature request
description: Ask for something the product does not do yet
labels: [enhancement]
body:
  - type: dropdown
    id: product
    attributes:
      label: Product
      options:
        - Skram
        - Skram Vault
        - Skram Tunnel
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the problem before the solution.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: Optional — how you imagine this working.
    validations:
      required: false
